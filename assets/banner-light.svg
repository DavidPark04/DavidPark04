<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Dawit GitHub. AI Engineer. Building AI into products people actually use.">
<defs>
<filter id="soft" filterUnits="userSpaceOnUse" x="-300" y="-300" width="1600" height="940"><feGaussianBlur stdDeviation="60"/></filter>
<filter id="frost" filterUnits="userSpaceOnUse" x="-300" y="-300" width="1600" height="940"><feColorMatrix type="saturate" values="1.35"/></filter>
<filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="shadow" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#fff" stop-opacity="0.95"/><stop offset=".4" stop-color="#fff" stop-opacity="0.25"/>
<stop offset=".65" stop-color="#fff" stop-opacity="0.12"/><stop offset="1" stop-color="#fff" stop-opacity="0.7"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fff" stop-opacity="0.28"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f1f4"/></linearGradient>
<linearGradient id="ai" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0894FF"/><stop offset=".45" stop-color="#9B5CFF"/><stop offset="1" stop-color="#FF4F7B"/></linearGradient>
<radialGradient id="bronze" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#F4C99B"/><stop offset=".55" stop-color="#C98A55"/><stop offset="1" stop-color="#8E5A33"/></radialGradient>
<clipPath id="frame"><rect width="1000" height="340" rx="28"/></clipPath>
<g id="bd"><rect width="1000" height="340" fill="#f5f5f7"/><g filter="url(#soft)"><ellipse class="b0" cx="250" cy="90" rx="230" ry="170" fill="#8fb2ff" opacity="0.65"/><ellipse class="b1" cx="420" cy="300" rx="240" ry="140" fill="#d4b8ff" opacity="0.55"/><ellipse class="b2" cx="840" cy="80" rx="260" ry="150" fill="#ffc6b3" opacity="0.5"/><ellipse class="b3" cx="720" cy="330" rx="200" ry="110" fill="#8fb2ff" opacity="0.33"/></g></g>
</defs>
<style>text { font-family: -apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;SF Pro Text&quot;, &quot;Apple SD Gothic Neo&quot;, Pretendard, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, &quot;Malgun Gothic&quot;, sans-serif; } .in { opacity: 0; animation: in 1.1s cubic-bezier(.16,1,.3,1) forwards; } .d1 { animation-delay: .1s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .55s; } .b0, .b1, .b2, .b3 { animation: drift 16s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; } .b1 { animation-duration: 20s; } .b2 { animation-duration: 24s; animation-delay: -6s; } @keyframes in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } } @keyframes drift { from { transform: translate(-30px, 10px) scale(1); } to { transform: translate(50px, -12px) scale(1.12); } } @media (prefers-reduced-motion: reduce) { .in, .b0, .b1, .b2, .b3 { animation: none; opacity: 1; } }</style>
<g clip-path="url(#frame)"><use href="#bd"/>
<rect x="150" y="90" width="180" height="180" rx="42" fill="#000" opacity="0.1" filter="url(#shadow)"/>
<clipPath id="c1"><rect x="150" y="80" width="180" height="180" rx="42"/></clipPath>
<g clip-path="url(#c1)"><use href="#bd" filter="url(#frost)" transform="translate(240.0 170.0) scale(1.15) translate(-240.0 -170.0)"/><rect x="150" y="80" width="180" height="180" fill="#ffffff" opacity="0.52"/><rect x="150" y="80" width="180" height="180" fill="url(#sheen)"/><rect x="150" y="80" width="180" height="180" rx="42" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="14" filter="url(#edge)"/></g>
<rect x="150.6" y="80.6" width="178.8" height="178.8" rx="41.4" fill="none" stroke="url(#rim)" stroke-width="1.2"/>
<text class="in d1" x="240.0" y="208.0" font-size="112" font-weight="600" fill="url(#ai)" text-anchor="middle" letter-spacing="-2">D</text>
<g class="in d2">
<text x="382" y="166" font-size="70" font-weight="600" fill="#1d1d1f" text-anchor="start" letter-spacing="-1.6" >Dawit GitHub</text>
<text x="382" y="210" font-size="28" font-weight="500" fill="#6e6e73" text-anchor="start" letter-spacing="-0.4" >AI Engineer</text>
</g>
<text x="382" y="252" font-size="19" font-weight="400" fill="#86868b" text-anchor="start" letter-spacing="-0.2" class="in d3">Building AI into products people actually use.</text>
</g>
</svg>
