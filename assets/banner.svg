<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Hello, I'm Dawit. Backend Developer">
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="35%" stop-color="#5E5CE6"/>
      <stop offset="65%" stop-color="#BF5AF2"/>
      <stop offset="100%" stop-color="#FF6482"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.25 0;0.25 0;-0.25 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="25%" stop-color="#5E5CE6"/>
      <stop offset="50%" stop-color="#BF5AF2"/>
      <stop offset="75%" stop-color="#FF6482"/>
      <stop offset="100%" stop-color="#FF9F0A"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#16161a"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="soft" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="400" rx="24"/></clipPath>
  </defs>

  <style>
    .sf { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", "Helvetica Neue", "Segoe UI", "Noto Sans KR", sans-serif; }
    .eyebrow { font-size: 15px; font-weight: 600; letter-spacing: 4px; fill: #86868b; }
    .title { font-size: 76px; font-weight: 700; letter-spacing: -2.5px; fill: #f5f5f7; }
    .sub { font-size: 19px; font-weight: 500; fill: #a1a1a6; letter-spacing: -0.2px; }
    .fade { opacity: 0; animation: rise 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .45s; } .d3 { animation-delay: .8s; }
    .orb { animation: drift 14s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .o2 { animation-duration: 18s; animation-delay: -4s; } .o3 { animation-duration: 22s; animation-delay: -9s; }
    .glow { animation: breathe 5s ease-in-out infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes drift { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(120px,-10px) scale(1.15); } 100% { transform: translate(-90px,8px) scale(.95); } }
    @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .fade, .orb, .glow { animation: none; opacity: 1; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#vignette)"/>

    <!-- Apple Intelligence 스타일의 하단 오로라 -->
    <g filter="url(#blur)" opacity=".55">
      <ellipse class="orb" cx="300" cy="430" rx="260" ry="90" fill="#0A84FF"/>
      <ellipse class="orb o2" cx="620" cy="440" rx="280" ry="90" fill="#BF5AF2"/>
      <ellipse class="orb o3" cx="920" cy="430" rx="260" ry="90" fill="#FF6482"/>
    </g>
    <g class="glow">
      <rect x="0" y="396" width="1200" height="4" fill="url(#edge)" filter="url(#soft)"/>
      <rect x="0" y="398" width="1200" height="2" fill="url(#edge)"/>
    </g>

    <g class="sf" text-anchor="middle">
      <text class="eyebrow fade d1" x="600" y="128">BACKEND DEVELOPER</text>
      <text class="title fade d2" x="600" y="215">Hello, I’m <tspan fill="url(#name)">Dawit.</tspan></text>
      <text class="sub fade d3" x="600" y="268">Spring으로 단단한 서버를 만듭니다.  ·  Dongyang Mirae Univ.</text>
    </g>
  </g>
</svg>
