<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Dawit GitHub. AI Engineer">
  <defs>
    <!-- Apple Intelligence 계열 색 -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0894FF"/>
      <stop offset="34%" stop-color="#C959DD"/>
      <stop offset="68%" stop-color="#FF2E54"/>
      <stop offset="100%" stop-color="#FF9004"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0894FF"/>
      <stop offset="35%" stop-color="#C959DD"/>
      <stop offset="70%" stop-color="#FF2E54"/>
      <stop offset="100%" stop-color="#FF9004"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b9b9c0"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <filter id="glowWide" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="glowNear" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="400" rx="28"/></clipPath>
  </defs>

  <style>
    .sf { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", sans-serif; }
    .label { font-size: 24px; font-weight: 600; letter-spacing: -0.3px; }
    .title { font-size: 104px; font-weight: 600; letter-spacing: -3px; }
    .tag { font-size: 23px; font-weight: 500; letter-spacing: -0.3px; fill: #86868b; }
    .in { opacity: 0; animation: in 1.2s cubic-bezier(.16,1,.3,1) forwards; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .45s; } .d3 { animation-delay: .8s; }
    .halo { animation: breathe 6s ease-in-out infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes breathe { 0%,100% { opacity: .7; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .in, .halo { animation: none; opacity: 1; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>

    <!-- 가장자리에서 안쪽으로 번지는 빛 -->
    <g class="halo" fill="none" stroke="url(#ring)">
      <rect x="0" y="0" width="1200" height="400" rx="28" stroke-width="44" filter="url(#glowWide)" opacity=".75"/>
      <rect x="0" y="0" width="1200" height="400" rx="28" stroke-width="14" filter="url(#glowNear)"/>
      <rect x="1" y="1" width="1198" height="398" rx="27" stroke-width="2.5"/>
    </g>

    <g class="sf" text-anchor="middle">
      <text class="label in d1" x="600" y="138" fill="url(#label)">AI Engineer</text>
      <text class="title in d2" x="600" y="238" fill="url(#metal)">Dawit GitHub</text>
      <text class="tag in d3" x="600" y="290">Building AI into products people actually use.</text>
    </g>
  </g>
</svg>
